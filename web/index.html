<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busquets sketches</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0c0d0c; color: #e8e4d8; font: 17px/1.4 Georgia, serif; }
  main { display: grid; gap: 14px; padding: max(24px, env(safe-area-inset-top)) 16px 32px; max-width: 560px; margin: 0 auto; }
  a { display: block; height: 26vh; min-height: 150px; border-radius: 18px; text-decoration: none; color: inherit; position: relative; overflow: hidden; }
  a span { position: absolute; left: 18px; bottom: 14px; letter-spacing: .02em; }
  .pivot { background: radial-gradient(circle at 50% 50%, #fff6 0 7px, transparent 8px), radial-gradient(circle at 30% 30%, #cde3f6 0 6px, transparent 7px), radial-gradient(circle at 72% 64%, #ee6b5c 0 6px, transparent 7px), repeating-linear-gradient(0deg, #17401f 0 22px, #1b4924 22px 44px); }
  .pulse { background: radial-gradient(circle at 50% 46%, #fff 0 3px, #ffd27a55 5px, transparent 26px), radial-gradient(circle at 24% 30%, #ffc56c 0 2px, transparent 14px), radial-gradient(circle at 78% 66%, #9fd0ff 0 2px, transparent 14px), radial-gradient(circle at 64% 22%, #1c1030 0 30px, transparent 46px), #05060d; }
  .garden { background: radial-gradient(circle at 50% 50%, #2b2a26 0 4px, transparent 5px), linear-gradient(115deg, transparent 46%, #8b6b4a44 47% 48%, transparent 49%), linear-gradient(35deg, transparent 52%, #4a6b7a44 53% 54%, transparent 55%), #e9e3d4; color: #2b2a26; }
</style>
</head>
<body>
<main>
  <a class="pivot" href="pivot/"><span>Pivot</span></a>
  <a class="pulse" href="pulse/"><span>Pulse</span></a>
  <a class="garden" href="garden/"><span>Rondo Garden</span></a>
</main>
</body>
</html>
