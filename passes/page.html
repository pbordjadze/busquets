<title>Busquets in Light</title>
<style>
  :root { --night: #020406; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--night); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sb { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        width: 76px; opacity: .42; pointer-events: none; user-select: none; }
</style>
<canvas id="c"></canvas>
<img id="sb" src="__LOGO__" alt="Data: StatsBomb">
<script>
"use strict";
// Every pass Sergio Busquets played in StatsBomb's open data (La Liga 2008/09-2020/21, the World Cups,
// the Euro, Champions League finals, Inter Miami), in the order he played them. 7 bytes a pass:
// x0*2, y0*3, x1*2, y1*3 (StatsBomb's 120x80 pitch, his team attacking +x), match second (u16), flags
// (1 = didn't find its man, 2 = first pass of a match).
const raw = Uint8Array.from(atob("__PASSES__"), ch => ch.charCodeAt(0));
const N = (raw.length / 7) | 0;

const P = new Float32Array(N * 4), MT = new Float64Array(N), BAD = new Uint8Array(N);
const DIR = new Float32Array(N), LEN = new Float32Array(N);
{
  let base = 0, first = 0;
  for (let i = 0; i < N; i++) {
    const k = i * 7;
    const x0 = raw[k] / 2, y0 = raw[k + 1] / 3, x1 = raw[k + 2] / 2, y1 = raw[k + 3] / 3;
    const t = raw[k + 4] | (raw[k + 5] << 8), f = raw[k + 6];
    if (f & 2) { base = i ? MT[i - 1] + 1500 : 0; first = t; }   // a breath between matches
    P.set([x0, y0, x1, y1], i * 4);
    MT[i] = base + (t - first);
    BAD[i] = f & 1;
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 0.01;
    LEN[i] = l;
    const c = dx / l;
    DIR[i] = Math.sign(c) * Math.pow(Math.abs(c), 0.8);   // +1 forward, -1 back
  }
}
const TOTAL = MT[N - 1];

// Playback: match time runs at v0 * e^(t/tau): one match at first, a pass at a time, then seasons in seconds.
const V0 = 42, BUILD = 175;
let TAU = 20;
{ let lo = 5, hi = 200; for (let j = 0; j < 80; j++) { const m = (lo + hi) / 2; (V0 * m * (Math.exp(BUILD / m) - 1) > TOTAL) ? (lo = m) : (hi = m); } TAU = (lo + hi) / 2; }
const A = V0 * TAU;
const speed = t => V0 * Math.exp(Math.max(t, 0) / TAU);
const TP = new Float64Array(N), DUR = new Float32Array(N);
for (let i = 0; i < N; i++) {
  TP[i] = TAU * Math.log(1 + MT[i] / A);
  const s = 1 / Math.sqrt(1 + speed(TP[i]) / 260);
  DUR[i] = Math.max(0.11, (0.5 + LEN[i] / 38) * s);
}
const MEAN_GAP = TOTAL / N;   // match seconds per pass

// ---------------------------------------------------------------- GL
const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
const hdr = gl && (gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float"));

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}

const SEGS = 22;
const LINE_VS = `#version 300 es
layout(location=0) in vec4 a_seg;
layout(location=1) in vec4 a_m;          // t0, t1 along the arc; kind; intensity
uniform vec2 u_res; uniform vec3 u_mx; uniform vec3 u_my;   // world -> pixel rows
uniform float u_w; uniform float u_taper; uniform float u_bend;
out vec2 v_uv; out vec3 v_col; out float v_i;
vec2 px(vec2 w){ return vec2(dot(u_mx, vec3(w,1.)), dot(u_my, vec3(w,1.))); }
void main(){
  int id = gl_VertexID; int sg = id / 6; int c = id - sg * 6;
  float a = (c==1||c==4||c==5) ? 1. : 0.;
  float side = (c==2||c==3||c==5) ? 1. : -1.;
  float s = (float(sg) + a) / float(${SEGS});
  float t = mix(a_m.x, a_m.y, s);
  vec2 w0 = a_seg.xy, w2 = a_seg.zw, d = w2 - w0;
  vec2 w1 = (w0 + w2) * .5 + vec2(-d.y, d.x) * u_bend;      // every pass bends the same way: a lofted, curling ball
  vec2 p0 = px(w0), p1 = px(w1), p2 = px(w2);
  float m = 1. - t;
  vec2 b = m*m*p0 + 2.*m*t*p1 + t*t*p2;
  vec2 tg = 2.*m*(p1 - p0) + 2.*t*(p2 - p1);
  vec2 n = normalize(vec2(-tg.y, tg.x) + 1e-6);
  float w = u_w * mix(1., mix(.25, 1., s), u_taper);
  b += n * side * w;
  vec2 cl = b / u_res * 2. - 1.;
  gl_Position = vec4(cl.x, -cl.y, 0, 1);
  v_uv = vec2(s, side);
  float k = a_m.z;
  vec3 lat = vec3(1., .80, .55), warm = vec3(1., .50, .20), cool = vec3(.42, .62, 1.);
  v_col = k > 2.5 ? vec3(.80, .20, .36) * .5 : (k >= 0. ? mix(lat, warm, k) : mix(lat, cool, -k));
  v_i = a_m.w;
}`;
const LINE_FS = `#version 300 es
precision highp float;
in vec2 v_uv; in vec3 v_col; in float v_i;
uniform float u_taper;
out vec4 o;
void main(){
  float across = exp(-v_uv.y * v_uv.y * 3.2);
  float along = mix(1., pow(v_uv.x, 2.4) + .9 * pow(v_uv.x, 40.), u_taper);
  o = vec4(v_col * v_i * across * along, 1.);
}`;
const FULL_VS = `#version 300 es
out vec2 v; void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); v = p; gl_Position = vec4(p*2.-1., 0, 1); }`;
const FADE_FS = `#version 300 es
precision mediump float; out vec4 o; void main(){ o = vec4(0); }`;
const COMBINE_FS = `#version 300 es
precision highp float; in vec2 v; uniform sampler2D u_a, u_b; uniform float u_ea, u_eb; out vec4 o;
void main(){ o = vec4(texture(u_a, v).rgb * u_ea + texture(u_b, v).rgb * u_eb, 1.); }`;
const DOWN_FS = `#version 300 es
precision highp float; in vec2 v; uniform sampler2D u_t; uniform vec2 u_px; out vec4 o;
void main(){ vec2 h = u_px * .5;
  o = .25 * (texture(u_t, v + vec2(h.x,h.y)) + texture(u_t, v + vec2(-h.x,h.y)) + texture(u_t, v + vec2(h.x,-h.y)) + texture(u_t, v - h)); }`;
const BLUR_FS = `#version 300 es
precision highp float; in vec2 v; uniform sampler2D u_t; uniform vec2 u_d; out vec4 o;
void main(){
  vec4 s = texture(u_t, v) * .2270270;
  s += (texture(u_t, v + u_d * 1.3846154) + texture(u_t, v - u_d * 1.3846154)) * .3162162;
  s += (texture(u_t, v + u_d * 3.2307692) + texture(u_t, v - u_d * 3.2307692)) * .0702703;
  o = s; }`;
const FINAL_FS = `#version 300 es
precision highp float; in vec2 v;
uniform sampler2D u_s, u_b1, u_b2; uniform vec2 u_res; uniform vec3 u_ix; uniform vec3 u_iy;
uniform float u_fade, u_pitch, u_time, u_exp;
out vec4 o;
float box(vec2 p, vec2 a, vec2 b){ vec2 c=(a+b)*.5, h=(b-a)*.5; vec2 q=abs(p-c)-h; return abs(length(max(q,0.))+min(max(q.x,q.y),0.)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
void main(){
  vec2 fc = vec2(gl_FragCoord.x, u_res.y - gl_FragCoord.y);
  vec3 hd = texture(u_s, v).rgb + texture(u_b1, v).rgb * .55 + texture(u_b2, v).rgb * .5;
  vec3 c = 1. - exp(-hd * u_exp);
  // the pitch, barely there: chalk that the light catches
  vec2 w = vec2(dot(u_ix, vec3(fc,1.)), dot(u_iy, vec3(fc,1.)));
  float ppm = 1. / length(vec2(u_ix.x, u_iy.x));      // pixels per metre
  float d = box(w, vec2(0), vec2(120,80));
  d = min(d, abs(w.x - 60.) + max(0., abs(w.y - 40.) - 40.));
  d = min(d, abs(length(w - vec2(60,40)) - 9.15));
  d = min(d, box(w, vec2(0,18), vec2(18,62)));  d = min(d, box(w, vec2(102,18), vec2(120,62)));
  d = min(d, box(w, vec2(0,30), vec2(6,50)));   d = min(d, box(w, vec2(114,30), vec2(120,50)));
  d = min(d, box(w, vec2(-2.4,36), vec2(0,44))); d = min(d, box(w, vec2(120,36), vec2(122.4,44)));
  float arcL = abs(length(w - vec2(12,40)) - 9.15) + max(0., 18. - w.x) * 4.;
  float arcR = abs(length(w - vec2(108,40)) - 9.15) + max(0., w.x - 102.) * 4.;
  d = min(d, min(arcL, arcR));
  d = min(d, min(length(w - vec2(60,40)), min(length(w - vec2(12,40)), length(w - vec2(108,40)))) - .18);
  float lw = max(.07, .6 / ppm);
  float line = 1. - smoothstep(lw, lw + 1.2 / ppm, d);
  vec2 q = v - .5; c *= 1. - dot(q, q) * .55;
  c = pow(max(c, 0.), vec3(1. / 2.2));
  float lum = dot(c, vec3(.3,.5,.2));
  float inside = 1. - smoothstep(0., 3., max(max(-w.x, w.x - 120.), max(-w.y, w.y - 80.)));
  c += vec3(.012,.020,.022) * inside * u_pitch;                       // the ground, a shade off the night
  c += vec3(.55,.66,.70) * line * u_pitch * (.07 + lum * .08);         // chalk the light catches
  c *= u_fade;
  c += (hash(fc + fract(u_time) * 97.) - .5) / 255. * 1.6;
  o = vec4(c + vec3(.006,.009,.012), 1.);
}`;

let L, F, C, D, BL, FN, quadVAO, lineVAO, instBuf;
let W = 0, H = 0, ppm = 1, mx = [1, 0, 0], my = [0, 1, 0], ix = [1, 0, 0], iy = [0, 1, 0];
let perm, recent, scene, b1, b1t, b2, b2t;

function target(w, h) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb, w, h };
}
function drop(t) { if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); } }

function layout() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, cv.clientWidth), ch = Math.max(1, cv.clientHeight);
  const sc = Math.min(dpr, 2, Math.sqrt(5.0e6 / (cw * ch)));
  W = Math.round(cw * sc); H = Math.round(ch * sc);
  cv.width = W; cv.height = H;
  const portrait = H > W * 1.05;
  const mw = portrait ? 80 : 120, mh = portrait ? 120 : 80;          // pitch extent on screen, metres
  const pad = 0.92;
  ppm = Math.min(W / (mw + 6), H / (mh + 6)) * (portrait ? 1 : pad + (1 - pad) * 0.5);
  const ox = W / 2, oy = H / 2;
  if (portrait) {   // attacking up the screen, his left on the left
    mx = [0, ppm, ox - 40 * ppm]; my = [-ppm, 0, oy + 60 * ppm];
    ix = [0, -1 / ppm, (oy + 60 * ppm) / ppm]; iy = [1 / ppm, 0, -(ox - 40 * ppm) / ppm];
  } else {          // attacking right
    mx = [ppm, 0, ox - 60 * ppm]; my = [0, ppm, oy - 40 * ppm];
    ix = [1 / ppm, 0, -(ox - 60 * ppm) / ppm]; iy = [0, 1 / ppm, -(oy - 40 * ppm) / ppm];
  }
  [perm, recent, scene, b1, b1t, b2, b2t].forEach(drop);
  perm = target(W, H); scene = target(W, H);
  recent = target(W >> 1, H >> 1);
  b1 = target(W >> 2, H >> 2); b1t = target(W >> 2, H >> 2);
  b2 = target(W >> 4, H >> 4); b2t = target(W >> 4, H >> 4);
  if (landed > 0) traces(0, landed, perm, permI, 1);   // the light so far, redrawn at the new size
}

const INST = new Float32Array(8 * 4096);
function lines(fb, items, count, width, taper, set) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb.fb); gl.viewport(0, 0, fb.w, fb.h);
  gl.useProgram(L.p);
  const s = fb.w / W;
  gl.uniform2f(L.u.u_res, fb.w, fb.h);
  gl.uniform3f(L.u.u_mx, mx[0] * s, mx[1] * s, mx[2] * s); gl.uniform3f(L.u.u_my, my[0] * s, my[1] * s, my[2] * s);
  gl.uniform1f(L.u.u_w, width * s); gl.uniform1f(L.u.u_taper, taper); gl.uniform1f(L.u.u_bend, 0.13);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.bindVertexArray(lineVAO); gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  for (let a = 0; a < count; a += 4096) {
    const n = Math.min(4096, count - a);
    for (let j = 0; j < n; j++) set(items(a + j), INST, j * 8);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, INST, 0, n * 8);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6 * SEGS, n);
  }
  gl.disable(gl.BLEND);
}
// a pass's trace: what stays on the pitch once the ball has arrived
function traces(from, to, fb, inten, widthK) {
  lines(fb, j => from + j, to - from, traceW() * widthK, 0, (i, o, k) => {
    o[k] = P[i * 4]; o[k + 1] = P[i * 4 + 1]; o[k + 2] = P[i * 4 + 2]; o[k + 3] = P[i * 4 + 3];
    o[k + 4] = 0; o[k + 5] = 1; o[k + 6] = BAD[i] ? 3 : DIR[i]; o[k + 7] = inten(i) * (BAD[i] ? 0.45 : 1);
  });
}
const traceW = () => Math.max(1.15, ppm * 0.16);
const permI = () => 1;

function full(fb, p) { gl.bindFramebuffer(gl.FRAMEBUFFER, fb ? fb.fb : null); gl.viewport(0, 0, fb ? fb.w : W, fb ? fb.h : H); gl.useProgram(p.p); gl.bindVertexArray(quadVAO); }
function tex(unit, t, loc) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t.tex); gl.uniform1i(loc, unit); }
function blur(src, tmp) {
  full(tmp, BL); tex(0, src, BL.u.u_t); gl.uniform2f(BL.u.u_d, 1 / src.w, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
  full(src, BL); tex(0, tmp, BL.u.u_t); gl.uniform2f(BL.u.u_d, 0, 1 / src.h); gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function down(src, dst) { full(dst, D); tex(0, src, D.u.u_t); gl.uniform2f(D.u.u_px, 1 / src.w, 1 / src.h); gl.drawArrays(gl.TRIANGLES, 0, 3); }

// ---------------------------------------------------------------- the film
const INTRO = 3.0, HOLD = 48, OUT = 7;
let clock = -INTRO, launched = 0, landed = 0, flying = [], afterglow = [], nextEcho = 0;

function exposure(n) { return 0.9 / Math.pow(1 + n / 150, 0.85); }   // the eye adjusting as the light gathers

function frame(dt) {
  clock += dt;
  const t = clock, cycleEnd = BUILD + HOLD + OUT;
  if (t > cycleEnd) { restart(); return; }
  const v = speed(Math.min(t, BUILD));
  const pps = v / MEAN_GAP;

  // decay the recent glow
  gl.bindFramebuffer(gl.FRAMEBUFFER, recent.fb); gl.viewport(0, 0, recent.w, recent.h);
  gl.enable(gl.BLEND); gl.blendColor(0, 0, 0, Math.exp(-dt / 2.6)); gl.blendFunc(gl.ZERO, gl.CONSTANT_ALPHA);
  gl.useProgram(F.p); gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.disable(gl.BLEND);

  while (launched < N && TP[launched] <= t) flying.push(launched++);
  // arrivals
  const arrived = [];
  flying = flying.filter(i => { if (t >= TP[i] + DUR[i]) { arrived.push(i); return false; } return true; });
  const recentI = 2.2 / Math.sqrt(1 + pps * 2.6 / 3);
  if (arrived.length) {
    arrived.sort((a, b) => a - b);
    lines(perm, j => arrived[j], arrived.length, traceW(), 0, traceSet(() => 1));
    lines(recent, j => arrived[j], arrived.length, traceW() * 1.6, 0, traceSet(() => recentI));
    landed += arrived.length;
  }

  // after the last pass: the whole of it, with old passes flying again now and then
  if (t > BUILD && landed >= N && t < BUILD + HOLD) {
    nextEcho -= dt;
    while (nextEcho <= 0) { const i = (Math.random() * N) | 0; afterglow.push({ i, t0: t, d: 0.6 + LEN[i] / 30 }); nextEcho += 0.35 + Math.random() * 0.9; }
  }

  // scene = permanent light + recent glow, then the balls in flight
  const ePerm = exposure(landed) * Math.min(1, ppm * 0.16 / traceW());   // thicker-than-true lines on small screens, less light each
  full(scene, C); tex(0, perm, C.u.u_a); tex(1, recent, C.u.u_b); gl.uniform1f(C.u.u_ea, ePerm); gl.uniform1f(C.u.u_eb, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const comets = [];
  const tail = 0.42, cI = 3.2 / Math.sqrt(1 + pps / 6);
  for (const i of flying) comets.push([i, (t - TP[i]) / DUR[i], cI]);
  afterglow = afterglow.filter(e => { const p = (t - e.t0) / e.d; if (p > 1 + tail) { echoLand(e.i); return false; } comets.push([e.i, p, 2.4]); return true; });
  if (comets.length) {
    lines(scene, j => comets[j], comets.length, Math.max(2.2, ppm * 0.34), 1, (c, o, k) => {
      const [i, p, ci] = c;
      o[k] = P[i * 4]; o[k + 1] = P[i * 4 + 1]; o[k + 2] = P[i * 4 + 2]; o[k + 3] = P[i * 4 + 3];
      o[k + 4] = Math.max(0, p - tail); o[k + 5] = Math.min(1, p);
      o[k + 6] = BAD[i] ? 3 : DIR[i];
      o[k + 7] = ci * (p > 1 ? Math.max(0, 1 - (p - 1) / tail) : Math.min(1, p * 6)) * (BAD[i] ? 0.8 : 1);
    });
  }

  down(scene, b1); blur(b1, b1t); down(b1, b2); blur(b2, b2t); blur(b2, b2t);

  let fade = 1;
  if (t < 0) fade = 1;
  if (t > BUILD + HOLD) fade = Math.max(0, 1 - (t - BUILD - HOLD) / OUT);
  const pitch = Math.min(1, Math.max(0, (t + INTRO) / INTRO));
  full(null, FN);
  tex(0, scene, FN.u.u_s); tex(1, b1, FN.u.u_b1); tex(2, b2, FN.u.u_b2);
  gl.uniform2f(FN.u.u_res, W, H); gl.uniform3f(FN.u.u_ix, ...ix); gl.uniform3f(FN.u.u_iy, ...iy);
  gl.uniform1f(FN.u.u_fade, fade * fade * (3 - 2 * fade)); gl.uniform1f(FN.u.u_pitch, pitch * pitch); gl.uniform1f(FN.u.u_time, t);
  gl.uniform1f(FN.u.u_exp, 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function traceSet(inten) {
  return (i, o, k) => {
    o[k] = P[i * 4]; o[k + 1] = P[i * 4 + 1]; o[k + 2] = P[i * 4 + 2]; o[k + 3] = P[i * 4 + 3];
    o[k + 4] = 0; o[k + 5] = 1; o[k + 6] = BAD[i] ? 3 : DIR[i]; o[k + 7] = inten(i) * (BAD[i] ? 0.45 : 1);
  };
}
function echoLand(i) { lines(recent, () => i, 1, traceW() * 1.6, 0, traceSet(() => 1.4)); }

function restart() {
  clock = -INTRO; launched = 0; landed = 0; flying = []; afterglow = []; nextEcho = 0;
  for (const t of [perm, recent]) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
}

// jump the film to playback time t (for looking at it headless)
window.__step = dt => frame(dt);
window.__seek = t => {
  restart(); clock = t;
  while (launched < N && TP[launched] + DUR[launched] <= t) launched++;
  traces(0, launched, perm, permI, 1); landed = launched;
  const tail0 = Math.max(0, t - 6);
  let a = 0; while (a < launched && TP[a] + DUR[a] < tail0) a++;
  const now = t;
  lines(recent, j => a + j, launched - a, traceW() * 1.6, 0, traceSet(i => {
    const pps = speed(TP[i]) / MEAN_GAP; return 2.2 / Math.sqrt(1 + pps * 2.6 / 3) * Math.exp(-(now - TP[i] - DUR[i]) / 2.6);
  }));
  while (launched < N && TP[launched] <= t) flying.push(launched++);
};

function init() {
