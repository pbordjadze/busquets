# Busquets: a shared engine for "get the ball, make a decision, at your own pace" (README.md), and the
# takes built on it. kit is the device/GPU/check layer (vendored from terra-incognita's toy-kit, see
# NOTICE.md); pitch is the football: players, ball, your-pace time, scanning, passing lanes.
[workspace]
resolver = "2"
members = ["crates/pitch", "crates/real", "crates/web", "takes/pivot", "takes/pulse", "takes/garden", "takes/studies", "takes/watch", "takes/eyes", "takes/ghost", "takes/light", "takes/busquets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
kit = { package = "toy-kit", git = "https://github.com/pbordjadze/terra-incognita", rev = "cc0f56c2d8e07542c059c0bacbbbd7580e28d51a", default-features = false }
pitch = { path = "crates/pitch" }
real = { path = "crates/real" }
wgpu = { version = "26", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
