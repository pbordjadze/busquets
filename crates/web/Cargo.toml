[package]
name = "busquets-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The web build: every take in one wasm, chosen by the page (WebGPU)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kit = { workspace = true }
pivot = { path = "../../takes/pivot" }
pulse = { path = "../../takes/pulse" }
garden = { path = "../../takes/garden" }
ghost = { path = "../../takes/ghost" }
light = { path = "../../takes/light" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
