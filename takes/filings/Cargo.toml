[package]
name = "filings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Iron Filings (a working title): you never touch the ball; drag yourself and your teammates snap into triangles around you, like filings round a magnet; each triangle the ball passes through strikes a note."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
kit = { workspace = true }
pitch = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "filings-check"
path = "src/bin/check.rs"

[features]
# the take as its own app (its C ABI); the one app (takes/busquets) turns it off to hold every take
default = ["app"]
app = []
