[package]
name = "pulse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pulse (a working title): a drifting constellation keeping its shape, the ball a pulse of light, each pass a note."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
kit = { workspace = true }
pitch = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "pulse-check"
path = "src/bin/check.rs"

[features]
# the take as its own app (its C ABI); the one app (takes/busquets) turns it off to hold every take
default = ["app"]
app = []
