[package]
name = "watch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Watch (a working title): the engine playing itself, from a rondo to eleven a side, Paul's hand on the dials."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
kit = { workspace = true }
pitch = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "watch-check"
path = "src/bin/check.rs"

[features]
# the take as its own app (its C ABI); the one app (takes/busquets) turns it off to hold every take
default = ["app"]
app = []
