[package]
name = "garden"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rondo Garden (a working title): an endless, meditative rondo; every pass draws its trail on the ground."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
kit = { workspace = true }
pitch = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "garden-check"
path = "src/bin/check.rs"

[features]
# the take as its own app (its C ABI); the one app (takes/busquets) turns it off to hold every take
default = ["app"]
app = []
