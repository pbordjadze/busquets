[package]
name = "busquets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Busquets (a working title): the one app, every take inside it."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
kit = { workspace = true }
pitch = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
filings = { path = "../filings", default-features = false }
lighthouse = { path = "../lighthouse", default-features = false }
hole = { path = "../hole", default-features = false }

[[bin]]
name = "busquets-check"
path = "src/bin/check.rs"
