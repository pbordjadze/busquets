[package]
name = "hole"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The Hole (a working title): a real 360 freeze-frame of Busquets' team with him taken out (StatsBomb open data, fetched at run time); find his pocket, then see where he really was."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
kit = { workspace = true }
pitch = { workspace = true }
wgpu = { workspace = true }
anyhow = { workspace = true }
real = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "hole-check"
path = "src/bin/check.rs"

[features]
# the take as its own app (its C ABI); the one app (takes/busquets) turns it off to hold every take
default = ["app"]
app = []
